# Every night: build and test on Linux, Windows and macOS and replace the
# nightly release with the new downloads. Nights without new commits are
# skipped, a run by hand builds anyway.
#
# Each package brings its libclang and clang's own headers (stddef.h and
# the intrinsics, the "resource directory"), which the indexer looks for
# beside the program. The C and C++ standard library headers come from the
# user's system: a compiler there (gcc, Visual Studio or the Xcode command
# line tools) has them. Python projects need a python3 on the path.
name: Nightly

on:
  schedule:
    - cron: "51 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  QT_VERSION: "6.12.0"
  LLVM_VERSION: "18"
  # Visual Studio's standard library wants a recent clang (19 or newer as
  # of Visual Studio 2022 17.14): the newest LLVM release
  WINDOWS_LLVM_VERSION: "23.1.5"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: check
        name: Anything new since the last nightly?
        run: |
          last=$(git rev-parse -q --verify "refs/tags/nightly^{commit}" || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$last" != "$GITHUB_SHA" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing new since $last"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    # The oldest runner, an AppImage runs on systems at least as new
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # Ubuntu 22.04 has libclang 15 at most: LLVM's own packages
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1 libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libfontconfig1 libfuse2 dpkg-dev
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y "libclang-$LLVM_VERSION-dev"

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUNRAVEL_LLVM_ROOT=/usr/lib/llvm-$LLVM_VERSION
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-log-linux
          path: |
            build/Testing/Temporary/LastTest.log
            build/test-results/
          retention-days: 7

      - name: AppImage
        run: |
          base=https://github.com/linuxdeploy
          wget -q $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q $base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          # Our QML and what igitt's style builds on (packaging/qml-imports)
          export QML_SOURCES_PATHS="$GITHUB_WORKSPACE/qml:$GITHUB_WORKSPACE/packaging/qml-imports"
          # The SVG icons
          export EXTRA_PLATFORM_PLUGINS="libqoffscreen.so"
          export EXTRA_QT_MODULES="svg"
          export EXTRA_QT_PLUGINS="$EXTRA_QT_MODULES" # name in older plugin versions
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:/usr/lib/llvm-$LLVM_VERSION/lib:$LD_LIBRARY_PATH"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable build/bin/unravel --executable build/bin/unravel-cli \
            --desktop-file logo/unravel.desktop --icon-file logo/unravel.svg --plugin qt
          # clang's headers beside the libclang that came along
          mkdir -p "AppDir/usr/lib/clang/$LLVM_VERSION"
          cp -rL "/usr/lib/llvm-$LLVM_VERSION/lib/clang/$LLVM_VERSION/include" "AppDir/usr/lib/clang/$LLVM_VERSION/"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          mv Unravel-*.AppImage unravel-linux-x64.AppImage
          find AppDir/usr/plugins -maxdepth 2 | sort
          ls -la AppDir/usr/lib | grep -i -E "clang|llvm"

      # The AppImage has to start, index and show its window without a
      # display, with the clang headers it brings
      - name: Smoke test
        run: |
          AppDir/usr/bin/unravel-cli samples/warehouse --report "$RUNNER_TEMP/warehouse.md"
          ! grep -q "^### Parse errors" "$RUNNER_TEMP/warehouse.md"
          AppDir/usr/bin/unravel-cli samples/pyshop --report "$RUNNER_TEMP/pyshop.md"
          grep -q "modules import each other" "$RUNNER_TEMP/pyshop.md"
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen ./unravel-linux-x64.AppImage \
            samples/warehouse --grab "$RUNNER_TEMP/window.png"
          test -s "$RUNNER_TEMP/window.png"

      # A version after the one in CMake, rising with the commit time, so
      # package managers upgrade every nightly
      - name: Debian package
        run: |
          base=$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/CMakeCache.txt)
          stamp=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S)
          packaging/deb/build-deb.sh AppDir "$base+git$stamp.${GITHUB_SHA::7}" unravel-linux-x64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: unravel-linux
          path: |
            unravel-linux-x64.AppImage
            unravel-linux-x64.deb
          retention-days: 1

  windows:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      # Since 6.11 each Windows toolchain has its own folder in the Qt
      # repository, aqt 3.3.0 doesn't know that yet but its master does
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          cache: true

      # LLVM's release for Windows: libclang.dll, its import library, the
      # headers of its C interface and clang's own headers
      # (Git's tar, which reads xz; only the parts unravel needs)
      - name: libclang
        shell: bash
        run: |
          version="$WINDOWS_LLVM_VERSION"
          name="clang+llvm-$version-x86_64-pc-windows-msvc"
          curl -sSfL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$name.tar.xz"
          mkdir -p /c/llvm
          tar -xJf llvm.tar.xz -C /c/llvm --strip-components=1 \
            "$name/bin/libclang.dll" "$name/lib/libclang.lib" "$name/include/clang-c" \
            --wildcards "$name/lib/clang/*/include"
          test -f /c/llvm/include/clang-c/Index.h
          echo "UNRAVEL_LLVM_ROOT=C:/llvm" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DUNRAVEL_LLVM_ROOT=$env:UNRAVEL_LLVM_ROOT"
          cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-log-windows
          path: |
            build/Testing/Temporary/LastTest.log
            build/test-results/
          retention-days: 7

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory Unravel | Out-Null
          # Visual Studio adds a folder per configuration
          Copy-Item build/bin/Release/unravel.exe, build/bin/Release/unravel-cli.exe, C:\llvm\bin\libclang.dll Unravel/
          # Our QML and what igitt's style builds on (packaging/qml-imports)
          windeployqt --release --qmldir qml --qmldir packaging/qml-imports Unravel/unravel.exe
          # clang's own headers, where the indexer looks for them
          New-Item -ItemType Directory Unravel/lib/clang | Out-Null
          Copy-Item -Recurse "C:\llvm\lib\clang\*" Unravel/lib/clang/
          Copy-Item LICENSE Unravel/LICENSE.txt
          Compress-Archive -Path Unravel -DestinationPath unravel-windows-x64.zip

      # Inno Setup is on the runner image; install it should it go missing
      - name: Installer
        shell: pwsh
        run: |
          $paths = "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe"
          $iscc = Get-ChildItem $paths -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem $paths -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup not found" }
          $version = (Select-String -Path build/CMakeCache.txt -Pattern '^CMAKE_PROJECT_VERSION:STATIC=(.+)$').Matches[0].Groups[1].Value
          & $iscc.FullName /Q "/O$PWD" "/DAppVersion=$version" "/DAppFiles=$PWD\Unravel" packaging/windows/unravel.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The installer as users meet it: fixed folder, Start menu entry
          # and desktop shortcut
          $dir = "$env:LOCALAPPDATA\Programs\Unravel"
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Unravel.lnk"
          $desktop = Join-Path ([Environment]::GetFolderPath("Desktop")) "Unravel.lnk"
          $png = "$env:RUNNER_TEMP\window.png"
          $report = "$env:RUNNER_TEMP\warehouse.md"

          $p = Start-Process ./unravel-windows-x64-setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOLAUNCH=1" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup failed with $($p.ExitCode)" }
          foreach ($f in "$dir\unravel.exe", "$dir\unravel-cli.exe", "$dir\libclang.dll", "$dir\unins000.exe", $menu, $desktop) {
            if (-not (Test-Path $f)) { throw "Missing after installing: $f" }
          }

          # The installed program indexes with the clang headers it brings
          $p = Start-Process "$dir\unravel-cli.exe" -ArgumentList "samples\warehouse", "--report", $report -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "unravel-cli failed with $($p.ExitCode)" }
          if (Select-String -Path $report -Pattern '^### Parse errors' -Quiet) {
            Get-Content $report | Out-Host
            throw "clang could not parse the sample"
          }

          # and shows its window, in igitt's style
          $p = Start-Process "$dir\unravel.exe" -ArgumentList "samples\warehouse", "--grab", $png -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -or -not (Test-Path $png)) { throw "The window did not show" }

          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall failed with $($p.ExitCode)" }
          # The uninstaller runs on from a copy and removes itself
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\unravel.exe"); $i++) { Start-Sleep -Seconds 1 }
          foreach ($f in "$dir\unravel.exe", $menu, $desktop) {
            if (Test-Path $f) { throw "Still there after uninstalling: $f" }
          }

          # The zip, without installing
          Remove-Item $png
          $p = Start-Process Unravel/unravel.exe -ArgumentList "samples\warehouse", "--grab", $png -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -or -not (Test-Path $png)) { throw "The window did not show from the zip" }

      - uses: actions/upload-artifact@v4
        with:
          name: unravel-windows
          path: |
            unravel-windows-x64-setup.exe
            unravel-windows-x64.zip
          retention-days: 1

  macos:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: libclang
        run: |
          # Homebrew's current LLVM: Xcode's libc++ headers keep up with
          # recent clang releases
          brew install llvm
          echo "LLVM_PREFIX=$(brew --prefix llvm)" >> "$GITHUB_ENV"
          "$(brew --prefix llvm)/bin/clang" --version

      - name: Build
        run: |
          # Apple silicon only: Homebrew's libclang is built for it alone
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
            "-DUNRAVEL_LLVM_ROOT=$LLVM_PREFIX"
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-log-macos
          path: |
            build/Testing/Temporary/LastTest.log
            build/test-results/
          retention-days: 7

      - name: Disk image
        run: |
          app=build/Unravel.app
          mv build/bin/unravel.app "$app"
          cp build/bin/unravel-cli "$app/Contents/MacOS/"
          # Our QML and what igitt's style builds on (packaging/qml-imports);
          # libclang and what it links come along into Frameworks
          macdeployqt "$app" -qmldir="$GITHUB_WORKSPACE/qml" \
            -qmldir="$GITHUB_WORKSPACE/packaging/qml-imports" \
            -executable="$app/Contents/MacOS/unravel-cli" -libpath="$LLVM_PREFIX/lib"
          # Database drivers for servers unravel never talks to, linking
          # libraries users don't have
          rm -f "$app"/Contents/PlugIns/sqldrivers/libqsql{odbc,psql,mimer}.dylib
          # clang's own headers, where the indexer looks for them (not its
          # sanitizer runtimes next to them)
          for dir in "$LLVM_PREFIX"/lib/clang/*; do
            mkdir -p "$app/Contents/Resources/clang/$(basename "$dir")"
            cp -RL "$dir/include" "$app/Contents/Resources/clang/$(basename "$dir")/"
          done
          # Nothing may still load from Homebrew, users don't have it
          leaks=$(find "$app/Contents" -type f \( -perm -u+x -o -name '*.dylib' \) | while read -r f; do
            otool -l "$f" 2>/dev/null | awk -v f="$f" '/cmd LC_(LOAD|LOAD_WEAK|REEXPORT)_DYLIB/ {
              getline; getline; if ($2 ~ /^\/(opt\/homebrew|usr\/local)\//) print f ": " $2 }'
          done)
          if [ -n "$leaks" ]; then
            echo "Libraries left outside the bundle:" >&2
            echo "$leaks" >&2
            exit 1
          fi
          # Changed after macdeployqt signed it: sign again, ad hoc
          codesign --force --deep --sign - "$app"
          hdiutil create -volname Unravel -srcfolder "$app" -ov -format UDZO unravel-macos.dmg

      - name: Smoke test
        run: |
          app=build/Unravel.app
          "$app/Contents/MacOS/unravel-cli" samples/warehouse --report "$RUNNER_TEMP/warehouse.md"
          if grep -q "^### Parse errors" "$RUNNER_TEMP/warehouse.md"; then
            cat "$RUNNER_TEMP/warehouse.md"
            exit 1
          fi
          QT_QPA_PLATFORM=offscreen "$app/Contents/MacOS/unravel" samples/warehouse --grab "$RUNNER_TEMP/window.png"
          test -s "$RUNNER_TEMP/window.png"

      - uses: actions/upload-artifact@v4
        with:
          name: unravel-macos
          path: unravel-macos.dmg
          retention-days: 1

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: unravel-*
          path: artifacts
          merge-multiple: true

      # One rolling pre-release, its tag moves to the commit it was built from
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly artifacts/* --prerelease --target "$GITHUB_SHA" \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes "Built from $GITHUB_SHA. The newest development version, not tried in daily use yet. Each download brings its own libclang; the C and C++ standard library headers come from a compiler on your system (gcc or clang on Linux, Visual Studio or its Build Tools on Windows, the Xcode command line tools on macOS), and Python projects need python3 on the path. Windows: run unravel-windows-x64-setup.exe (or unzip the zip and start unravel.exe); SmartScreen warns because the program isn't signed (More info, Run anyway). macOS (Apple silicon): drag the app from the dmg into Applications; macOS blocks the first start, then choose Open Anyway under System Settings › Privacy & Security."
